{% extends 'base.html' %}

{% block content %}
<section class="max-w-7xl mx-auto px-4 py-20">
    <h2 class="text-2xl font-light mb-10 text-center uppercase tracking-widest">لیست علاقه‌مندی‌های من</h2>
    
    <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
        {% for fav in favorites %}
        <div class="group relative">
            <a href="{% url 'products:product_detail' fav.product.slug %}">
                <div class="aspect-[3/4] overflow-hidden bg-gray-100 mb-4">
                    <img src="{{ fav.product.image.url }}" class="w-full h-full object-cover">
                </div>
                <h3 class="text-sm text-center">{{ fav.product.name }}</h3>
            </a>
            <!-- دکمه حذف -->
            <a href="{% url 'products:toggle_favorite' fav.product.id %}" class="block text-center text-[10px] text-red-400 mt-2 hover:underline">حذف از لیست</a>
        </div>
        {% empty %}
        <div class="col-span-4 text-center py-20 bg-gray-50 text-gray-400">
            هنوز محصولی را به لیست خود اضافه نکرده‌اید.
        </div>
        {% endfor %}
    </div>
</section>
{% endblock %}

{% extends 'base.html' %}
{% block content %}
<div class="flex items-center justify-center min-h-[70vh] bg-gray-50 px-4">
    <div class="max-w-md w-full bg-white p-10 border shadow-sm text-center">
        <h2 class="text-2xl font-light tracking-widest uppercase mb-8">ورود به حساب</h2>
        <form method="post" class="space-y-6">
            {% csrf_token %}
            <input type="text" name="username" placeholder="نام کاربری" class="w-full border-b py-2 focus:outline-none focus:border-black font-light text-sm">
            <input type="password" name="password" placeholder="رمز عبور" class="w-full border-b py-2 focus:outline-none focus:border-black font-light text-sm">
            <button type="submit" class="w-full bg-black text-white py-3 mt-6 hover:bg-gray-800 transition uppercase text-xs tracking-widest">ورود</button>
        </form>
        <p class="mt-8 text-xs text-gray-400">حساب کاربری ندارید؟ <a href="{% url 'accounts:register' %}" class="text-black border-b border-black">ثبت نام کنید</a></p>
    </div>
</div>
{% endblock %}
